<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pitch: #0e3b2e; --chalk: #f4f2e8; --gold: #e8b23d; --gold-soft: #f2c463;
      --ink: #0a1210; --win: #269c5b; --win-text: #63d38e; --loss: #be383d; --loss-text: #ed777b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .root {
      width: 1800px; min-height: 1000px;
      background: radial-gradient(circle at 50% -10%, #163f30, #081714 65%);
      font-family: 'Oswald', sans-serif; color: var(--chalk);
      padding: 40px 48px;
    }
    .mono { font-family: 'Space Mono', monospace; font-variant-numeric: tabular-nums; }
    h1 { font-size: 30px; margin: 0; letter-spacing: 0.02em; text-transform: uppercase; }
    .eyebrow { color: var(--gold); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 6px; }
    .hero-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; }
    .hero-stat { text-align: right; }
    .hero-stat .label { color: rgba(244,242,232,0.5); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
    .hero-stat .value { font-size: 40px; color: var(--gold); font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card {
      background: rgba(10,18,16,0.55); border: 1px solid rgba(232,178,61,0.22);
      border-radius: 16px; padding: 26px; cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover { border-color: rgba(232,178,61,0.5); }
    .card.selected { border-color: var(--gold); background: rgba(232,178,61,0.07); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
    .card-name { font-size: 18px; letter-spacing: 0.03em; text-transform: uppercase; }
    .open-chip {
      font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px;
      border-radius: 999px; border: 1px solid rgba(232,178,61,0.4); color: var(--gold);
    }
    .card-saldo { font-size: 38px; font-weight: 700; color: var(--chalk); margin-bottom: 18px; }
    .withdraw-form { display: flex; gap: 8px; }
    .withdraw-form input {
      flex: 1; min-width: 0; font-family: 'Space Mono', monospace; font-size: 13px;
      padding: 9px 11px; border: 1px solid rgba(244,242,232,0.2); border-radius: 7px;
      background: var(--ink); color: var(--chalk);
    }
    .withdraw-form button {
      font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.05em;
      text-transform: uppercase; padding: 9px 14px; border-radius: 7px; border: 1px solid var(--gold);
      background: var(--gold); color: var(--ink); cursor: pointer; white-space: nowrap;
    }
    .journal-panel {
      margin-top: 24px;
      background: rgba(10,18,16,0.55); border: 1px solid rgba(232,178,61,0.25);
      border-radius: 16px; padding: 28px 32px;
    }
    .journal-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
    .journal-head h2 { font-size: 20px; margin: 0; text-transform: uppercase; letter-spacing: 0.02em; color: var(--gold); }
    .journal-table { width: 100%; border-collapse: collapse; }
    .journal-table th {
      text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(244,242,232,0.45); padding: 8px 12px; border-bottom: 1px solid rgba(244,242,232,0.15);
    }
    .journal-table td {
      padding: 12px; font-family: 'Space Mono', monospace; font-size: 13.5px;
      border-bottom: 1px dashed rgba(244,242,232,0.1);
    }
    .amount-credit { color: var(--win-text); }
    .amount-debit { color: var(--loss-text); }
    .tag-auto {
      margin-left: 8px; font-family: 'Oswald', sans-serif; font-size: 9px; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid rgba(232,178,61,0.4);
      color: var(--gold);
    }
    .empty-journal { color: rgba(244,242,232,0.4); font-size: 14px; padding: 20px 0; text-align: center; }
  </style>
</helmet>

<div class="root">
  <div class="hero-row">
    <div>
      <p class="eyebrow">Bet Tracker</p>
      <h1>Overzicht per bookmaker</h1>
    </div>
    <div class="hero-stat">
      <div class="label">Totaal saldo</div>
      <div class="value mono">€ {{totalBalance}}</div>
    </div>
  </div>

  <div class="grid">
    <sc-for list="{{bookmakers}}" as="b" hint-placeholder-count="6">
      <div class="card {{b.cardClass}}" onClick="{{b.select}}">
        <div class="card-top">
          <span class="card-name">{{b.name}}</span>
          <span class="open-chip">{{b.openLabel}}</span>
        </div>
        <div class="card-saldo mono">€ {{b.saldoFmt}}</div>
        <div class="withdraw-form" onClick="{{b.stop}}">
          <input type="text" placeholder="bedrag" />
          <button type="button">Uitbetaald</button>
        </div>
      </div>
    </sc-for>
  </div>

  <div class="journal-panel">
    <div class="journal-head">
      <h2>Journaal — {{selected.name}}</h2>
    </div>
    <sc-if value="{{selected.hasJournal}}" hint-placeholder-val="{{true}}">
      <table class="journal-table">
        <thead>
          <tr><th>Datum</th><th>Type</th><th>Bedrag</th><th>Saldo</th></tr>
        </thead>
        <tbody>
          <sc-for list="{{selected.journal}}" as="row" hint-placeholder-count="3">
            <tr>
              <td>14-09-2026</td>
              <td>{{row.label}}<sc-if value="{{row.auto}}" hint-placeholder-val="{{false}}"><span class="tag-auto">auto</span></sc-if></td>
              <td class="{{row.amountClass}}">{{row.amountFmt}}</td>
              <td>€ {{row.balanceFmt}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </sc-if>
    <sc-if value="{{selected.hasJournal}}" hint-placeholder-val="{{false}}">
      <div class="empty-journal">Nog geen activiteit bij deze bookmaker.</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script data-dc-script>
const RAW = [
  { id: 'bet365', name: 'Bet365', saldo: 210.40, openBets: 0, journal: [
    { label: 'Winst — Ajax wint', amount: 210.40, balance: 210.40 },
    { label: 'Ingezet — Ajax wint', amount: -100.00, balance: 0.00 },
    { label: 'Gestort', amount: 100.00, balance: 100.00, auto: true },
  ]},
  { id: 'betcity', name: 'BetCity', saldo: 39.37, openBets: 1, journal: [
    { label: 'Ingezet — Combi (3 selecties)', amount: -60.63, balance: 39.37 },
    { label: 'Gestort', amount: 100.00, balance: 100.00, auto: true },
  ]},
  { id: 'toto', name: 'Toto', saldo: 0.00, openBets: 1, journal: [
    { label: 'Ingezet — Combi (5 selecties)', amount: -100.00, balance: 0.00 },
    { label: 'Gestort', amount: 100.00, balance: 100.00, auto: true },
  ]},
  { id: 'unibet', name: 'Unibet', saldo: 0.00, openBets: 0, journal: [] },
  { id: '711', name: '711', saldo: 175.52, openBets: 0, journal: [
    { label: 'Winst — Combi (3 selecties)', amount: 175.52, balance: 175.52 },
    { label: 'Ingezet — Combi (3 selecties)', amount: -50.00, balance: 0.00 },
    { label: 'Gestort', amount: 50.00, balance: 50.00, auto: true },
  ]},
  { id: 'betmgm', name: 'BetMGM', saldo: 0.00, openBets: 0, journal: [] },
];

function fmt(n) { return n.toFixed(2); }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selectedId: 'bet365' };
  }

  renderVals() {
    const totalBalance = RAW.reduce((sum, b) => sum + b.saldo, 0);
    const bookmakers = RAW.map((b) => ({
      name: b.name,
      saldoFmt: fmt(b.saldo),
      openLabel: b.openBets === 0 ? 'Geen open bets' : (b.openBets + ' open'),
      cardClass: b.id === this.state.selectedId ? 'selected' : '',
      select: () => this.setState({ selectedId: b.id }),
      stop: (e) => e.stopPropagation(),
    }));

    const current = RAW.find((b) => b.id === this.state.selectedId) || RAW[0];
    const journal = current.journal.map((row) => ({
      label: row.label,
      auto: !!row.auto,
      amountClass: row.amount >= 0 ? 'amount-credit' : 'amount-debit',
      amountFmt: (row.amount >= 0 ? '+ € ' : '− € ') + fmt(Math.abs(row.amount)),
      balanceFmt: fmt(row.balance),
    }));

    return {
      totalBalance: fmt(totalBalance),
      bookmakers,
      selected: {
        name: current.name,
        hasJournal: current.journal.length > 0,
        journal,
      },
    };
  }
}
</script>
</body>
</html>
