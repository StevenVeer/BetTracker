<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --chalk: #f4f2e8; --gold: #e8b23d; --gold-soft: #f2c463;
      --ink: #0a1210; --win-text: #63d38e; --loss-text: #ed777b; --red: #e14b4b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--gold); }
    a:hover { color: var(--gold-soft); }
    .root {
      width: 1400px;
      background: radial-gradient(circle at 50% -60%, #163f30, #081714 65%);
      font-family: 'Oswald', sans-serif; color: var(--chalk);
      padding: 32px 20px;
    }
    .app-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; }
    .app-header h1 { font-size: 32px; margin: 0; letter-spacing: 0.02em; text-transform: uppercase; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr) auto; align-items: stretch; gap: 10px; }
    .summary > div { display: flex; flex-direction: column; gap: 4px; background: rgba(10,18,16,0.55); border-left: 3px solid var(--gold); padding: 10px 14px; }
    .summary strong { font-family: 'Space Mono', monospace; font-size: 20px; color: var(--gold); }
    .profit-positive { color: var(--win-text) !important; }
    .profit-negative { color: var(--loss-text) !important; }
    .muted { color: rgba(244,242,232,0.5); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .live-dot { display: inline-block; vertical-align: middle; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
    .btn { border: 1px solid rgba(244,242,232,0.25); background: transparent; border-radius: 8px; padding: 10px 16px; font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--chalk); white-space: nowrap; }
    .btn-primary { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 700; }
    .overview-btn { display: flex; align-items: center; justify-content: center; }
    .swap-note { margin: 16px 0 0; font-family: 'Space Mono', monospace; font-size: 11px; color: rgba(244,242,232,0.4); }
    .swap-note b { color: var(--gold); }
  </style>
</helmet>
<div class="root">
  <div class="app-header">
    <h1>Bet Tracker</h1>
    <div class="summary">
      <div><span class="muted">Bets <span class="live-dot"></span></span><strong>3</strong></div>
      <div><span class="muted">Inzet <span class="live-dot"></span></span><strong>75.00</strong></div>
      <div>
        <span class="muted">Resultaat vandaag</span>
        <strong class="profit-positive">+30.00 <span class="muted">(totaal +40.50)</span></strong>
      </div>
      <button type="button" class="btn btn-primary overview-btn">Overzicht</button>
    </div>
  </div>
  <p class="swap-note">Was: <b>Resultaat</b> (som van alle bets ooit) &rarr; wordt: <b>Resultaat vandaag</b>, met het totaal als context erbij.<br>De knop blijft één "Overzicht" — de keuze tussen Bookmakers/Per dag zit nu in het overzicht zelf (zie het andere artboard).</p>
</div>
</x-dc>
</body>
</html>
